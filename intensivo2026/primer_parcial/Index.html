<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNI-2026-FAMAF </title>
</head>
<body>
    <h1>Primer parcial - CNI26 - FAMAF</h1>
    <label for="number">DNI/CUIL/PAS (sin puntos):</label>
    <input type="text" id="number" name="number">
    <button onclick="searchCSV()">Buscar</button>
    <h2>Resultado:</h2>
    <div id="output"></div>
    <script>
        async function searchCSV() {
            const number = document.getElementById('number').value;
            const response = await fetch('PP_CNI_26.csv');
            const data = await response.text();
            const rows = data.split('\n').slice(1);
            const filteredRows = rows.filter(row => row.split(',')[0] === number);
            const output = document.getElementById('output');
            output.innerHTML = '';
            if (filteredRows.length > 0) {
                const row = filteredRows[0].split(',');
                output.innerHTML = `<H2>Nota primer parcial: ${row[1]} </H2>
                `;
            } else {
                output.innerHTML = 'No encontramos tu número de identificación. Por favor, comunica el error a valeria.cantero@unc.edu.ar';
            }
        }
    </script>
</body>
</html>
